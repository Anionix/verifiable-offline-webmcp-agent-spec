# information_uuid_v5=9e422e36-b03d-544a-97ad-ce33c921a9d3
# event_uuid_v7=01a04875-b4a6-7a03-9097-5d3b974e12fb
# machine-contract: PROPOSED -> EXECUTING -> VERIFIED only when secrets, schemas, types, tests, and the tracked manifest all pass.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history and working tree for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/typescript/package-lock.json

      - name: Install locked Node.js dependencies
        run: |
          npm ci
          npm ci --prefix src/typescript

      - name: Run the read-only verification pipeline
        run: make validate

      - name: Prove validation did not rewrite tracked files
        run: git diff --exit-code

      - name: Preserve the bounded validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-receipt
          path: .local/build-report.json
          if-no-files-found: warn
          retention-days: 7
