# machine-contract: publish only dist/client; unmatched paths stay missing and must never be rewritten to index.html.
[build]
command = "npm run build:web"
publish = "dist/client"

[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[headers]]
for = "/service-worker.js"

[headers.values]
Cache-Control = "no-cache"
Service-Worker-Allowed = "/"
