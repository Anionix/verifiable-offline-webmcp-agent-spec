[project]
name = "verifiable-offline-webmcp-agent-spec"
version = "0.1.0"
description = "Validation environment for the verifiable offline WebMCP agent specification"
requires-python = ">=3.12,<3.15"
dependencies = [
  "cryptography>=50,<51",
  "jsonschema[format]>=4.25,<5",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pyrefly==1.2.0",
  "ty==0.0.75",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["scripts", "formal/model-checker"]

[tool.pyrefly]
project-includes = ["scripts", "formal/model-checker"]
python-version = "3.12"
search-path = ["scripts"]

[tool.pyrefly.errors]
untyped-import = false
